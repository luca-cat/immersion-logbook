[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "immersion"
version = "0.1.0"
dependencies = [
    "typer",
    "rich",
    "python-dotenv",
    "requests",
    "fastapi",
    "sqlmodel",
    "uvicorn",
]

[project.scripts]
immersion = "main:app"

[tool.setuptools]
py-modules = ["main", "database", "logic", "tablecreation"]

[tool.setuptools.package-data]
"*" = ["config.ini"]
